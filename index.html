<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pena — Studio Penulisan Novel</title>
<style>
  :root{
    --ink:#241f1a;
    --paper:#f3ece0;
    --paper-2:#e9dfcd;
    --rule:#cdbfa3;
    --accent:#9a3324;
    --accent-soft:#c9d6c0;
    --gold:#a9852f;
    --teal:#1e6b6b;
    --teal-soft:#c5dede;
    --world:#4a3880;
    --world-soft:#ddd8f0;
    --card:#fffdf8;
    --muted:#7a6f5d;
    --display:"Iowan Old Style","Georgia","Times New Roman",serif;
    --body:"Charter","Georgia",serif;
    --ui:"Avenir Next","Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);}
  ::selection{background:var(--gold);color:#fff;}

  .shell{display:grid;grid-template-columns:270px 1fr;min-height:100vh;}
  @media(max-width:900px){.shell{grid-template-columns:1fr;}}

  /* Sidebar */
  .sidebar{background:var(--paper-2);border-right:1px solid var(--rule);padding:24px 18px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .brand{font-family:var(--display);font-size:26px;letter-spacing:.5px;display:flex;align-items:baseline;gap:8px;}
  .brand small{font-family:var(--ui);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
  .story-picker select{width:100%;padding:9px;border:1px solid var(--rule);background:var(--card);font-family:var(--ui);color:var(--ink);border-radius:4px;}
  .new-story-btn{width:100%;margin-top:7px;padding:8px;background:transparent;border:1px dashed var(--accent);color:var(--accent);font-family:var(--ui);font-size:13px;border-radius:4px;cursor:pointer;}
  .new-story-btn:hover{background:var(--accent);color:#fff;}

  .tab-group-label{font-family:var(--ui);font-size:9px;text-transform:uppercase;letter-spacing:2px;color:var(--muted);padding:0 12px;margin-top:4px;}
  nav.tabs{display:flex;flex-direction:column;gap:1px;}
  nav.tabs button{
    text-align:left;border:none;background:transparent;padding:10px 12px;font-family:var(--ui);
    font-size:13.5px;color:var(--ink);cursor:pointer;border-radius:4px;display:flex;align-items:center;gap:10px;
  }
  nav.tabs button .ico{font-size:15px;width:20px;text-align:center;flex-shrink:0;}
  nav.tabs button:hover{background:rgba(154,51,36,.07);}
  nav.tabs button.active{background:var(--accent);color:#fff;}

  /* char tab accent colours on active */
  nav.tabs button[data-tab="items"].active{background:var(--teal);}
  nav.tabs button[data-tab="worldsetting"].active{background:var(--world);}

  .sidebar-foot{margin-top:auto;font-family:var(--ui);font-size:10.5px;color:var(--muted);line-height:1.6;padding-top:12px;border-top:1px solid var(--rule);}

  main{padding:36px 48px;max-width:980px;}
  @media(max-width:900px){main{padding:22px;}}
  .page-head{margin-bottom:26px;}
  .page-head h1{font-family:var(--display);font-size:32px;margin:0 0 4px;}
  .page-head p{color:var(--muted);font-family:var(--ui);font-size:13.5px;margin:0;}
  .empty-story{padding:60px 20px;text-align:center;color:var(--muted);font-family:var(--ui);}

  .btn{font-family:var(--ui);font-size:13px;padding:8px 15px;border-radius:4px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer;}
  .btn:hover{background:#7e2a1d;}
  .btn.teal{border-color:var(--teal);background:var(--teal);}
  .btn.teal:hover{background:#154f4f;}
  .btn.world{border-color:var(--world);background:var(--world);}
  .btn.world:hover{background:#352870;}
  .btn.ghost{background:transparent;color:var(--accent);border-color:var(--accent);}
  .btn.ghost:hover{background:rgba(154,51,36,.08);}
  .btn.ghost.teal{color:var(--teal);border-color:var(--teal);}
  .btn.ghost.teal:hover{background:rgba(30,107,107,.08);}
  .btn.ghost.world{color:var(--world);border-color:var(--world);}
  .btn.ghost.world:hover{background:rgba(74,56,128,.08);}
  .btn.small{padding:5px 10px;font-size:12px;}

  input[type=text],textarea,select{
    width:100%;font-family:var(--body);font-size:15px;padding:10px 12px;border:1px solid var(--rule);
    border-radius:4px;background:var(--card);color:var(--ink);
  }
  input[type=text]:focus,textarea:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px;}
  label{font-family:var(--ui);font-size:10.5px;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);display:block;margin-bottom:5px;}
  .field{margin-bottom:15px;}
  textarea{min-height:120px;resize:vertical;line-height:1.7;}
  .row{display:flex;gap:14px;}
  .row>*{flex:1;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:8px;}
  .card{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:15px;position:relative;cursor:pointer;transition:box-shadow .15s,transform .15s;}
  .card:hover{box-shadow:0 5px 16px rgba(36,31,26,.11);transform:translateY(-2px);}
  .card h3{font-family:var(--display);font-size:17px;margin:0 0 5px;}
  .card p{font-family:var(--ui);font-size:12px;color:var(--muted);margin:0;line-height:1.5;}
  .card .badge{display:inline-block;font-family:var(--ui);font-size:9.5px;text-transform:uppercase;letter-spacing:1px;padding:2px 7px;border-radius:20px;margin-bottom:7px;}
  .badge.char{background:rgba(154,51,36,.12);color:var(--accent);}
  .badge.item{background:rgba(30,107,107,.12);color:var(--teal);}
  .badge.world{background:rgba(74,56,128,.12);color:var(--world);}
  .card .del{position:absolute;top:9px;right:9px;background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;}
  .card .del:hover{color:var(--accent);}

  .thumb-wrap{display:flex;gap:12px;align-items:center;}
  .thumb{width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);flex-shrink:0;background:var(--paper-2);}
  .thumb.item-thumb{border-radius:8px;border-color:var(--teal);}
  .thumb.placeholder{display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:18px;color:var(--gold);}
  .thumb.placeholder.item-ph{color:var(--teal);border-color:var(--teal);}

  .editor-card{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:22px;margin-bottom:20px;}
  .editor-card h2{font-family:var(--display);font-size:21px;margin:0 0 15px;}
  .toolbar{display:flex;justify-content:flex-end;gap:8px;margin-top:12px;}

  /* World setting sections */
  .ws-section{background:var(--paper-2);border:1px solid var(--rule);border-radius:6px;padding:18px;margin-bottom:14px;}
  .ws-section h3{font-family:var(--display);font-size:17px;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
  .ws-section h3 .ws-ico{font-size:18px;}

  /* Prose render with mention tooltips */
  .prose-render{font-family:var(--body);font-size:15.5px;line-height:1.9;white-space:pre-wrap;border-top:1px dashed var(--rule);margin-top:14px;padding-top:14px;}
  .char-mention{color:var(--accent);font-weight:600;border-bottom:1px dotted var(--accent);cursor:help;}
  .item-mention{color:var(--teal);font-weight:600;border-bottom:1px dotted var(--teal);cursor:help;}

  /* Shared tooltip base */
  .tooltip-pop{
    position:fixed;z-index:9999;background:var(--ink);color:#f3ece0;padding:10px 12px;border-radius:8px;
    display:flex;gap:11px;align-items:flex-start;box-shadow:0 8px 28px rgba(0,0,0,.38);pointer-events:none;
    max-width:270px;font-family:var(--ui);opacity:0;transition:opacity .12s;
  }
  .tooltip-pop.show{opacity:1;}
  .tooltip-pop img{width:58px;height:58px;object-fit:cover;flex-shrink:0;}
  .tooltip-pop .tp-char img,.tp-ph-char{border-radius:50%;}
  .tooltip-pop .tp-ph{width:58px;height:58px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:24px;flex-shrink:0;}
  .tp-ph-char{border-radius:50%;background:var(--gold);}
  .tp-ph-item{border-radius:8px;background:var(--teal);color:#fff;}
  .tp-name{font-family:var(--display);font-size:14px;margin:0 0 2px;}
  .tp-sub{font-size:10px;color:#c0b49a;letter-spacing:.5px;text-transform:uppercase;margin:0 0 4px;}
  .tp-desc{font-size:11px;color:#cfc6b4;line-height:1.45;margin:0;}

  .hint{font-family:var(--ui);font-size:11px;color:var(--muted);margin-top:5px;line-height:1.5;}
  .image-input-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
  .image-preview{width:58px;height:58px;object-fit:cover;border:1px solid var(--rule);}
  .image-preview.round{border-radius:50%;}
  .image-preview.square{border-radius:8px;}

  .modal-bg{position:fixed;inset:0;background:rgba(36,31,26,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal-bg.open{display:flex;}
  .modal{background:var(--card);border-radius:8px;padding:22px;width:100%;max-width:400px;}
  .modal h3{font-family:var(--display);margin-top:0;}

  .stat-row{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0;}
  .stat{font-family:var(--ui);font-size:12px;color:var(--muted);background:var(--paper-2);padding:5px 12px;border-radius:20px;}
</style>
</head>
<body>

<div class="shell">
  <aside class="sidebar">
    <div class="brand">Pena <small>studio novel</small></div>

    <div class="story-picker">
      <label for="storySelect">Cerita aktif</label>
      <select id="storySelect"></select>
      <button class="new-story-btn" id="newStoryBtn">+ Cerita baru</button>
    </div>

    <div>
      <div class="tab-group-label">Cerita</div>
      <nav class="tabs">
        <button data-tab="overview"><span class="ico">📖</span> Ringkasan</button>
      </nav>
      <div class="tab-group-label" style="margin-top:10px">Elemen</div>
      <nav class="tabs">
        <button data-tab="characters"><span class="ico">🧑</span> Karakter</button>
        <button data-tab="items"><span class="ico">⚔️</span> Item / Barang</button>
        <button data-tab="worldsetting"><span class="ico">🌍</span> Pengaturan Dunia</button>
      </nav>
      <div class="tab-group-label" style="margin-top:10px">Penulisan</div>
      <nav class="tabs">
        <button data-tab="plots"><span class="ico">🗺️</span> Plot</button>
        <button data-tab="scenes"><span class="ico">🎬</span> Adegan</button>
        <button data-tab="dialogues"><span class="ico">💬</span> Dialog</button>
      </nav>
    </div>

    <div class="sidebar-foot">
      Data tersimpan otomatis di browser (localStorage). Gunakan tombol Ekspor di Ringkasan untuk mencadangkan ceritamu.
    </div>
  </aside>

  <main id="main"></main>
</div>

<!-- Tooltips -->
<div class="tooltip-pop" id="charTooltip"></div>
<div class="tooltip-pop" id="itemTooltip"></div>

<!-- Modal baru cerita -->
<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3>Cerita baru</h3>
    <div class="field">
      <label>Judul cerita</label>
      <input type="text" id="modalTitle" placeholder="Misal: Bayang di Antara Hujan">
    </div>
    <div class="field">
      <label>Sinopsis singkat (opsional)</label>
      <textarea id="modalDesc" style="min-height:70px"></textarea>
    </div>
    <div class="toolbar">
      <button class="btn ghost" id="modalCancel">Batal</button>
      <button class="btn" id="modalCreate">Buat cerita</button>
    </div>
  </div>
</div>

<script>
/* ═══════════════════════════════════
   DATA LAYER
═══════════════════════════════════ */
const DB_KEY = "pena_novel_data_v2";

function loadDB(){
  // Try v2 first, then migrate from v1
  try{
    const raw = localStorage.getItem(DB_KEY);
    if(raw) return JSON.parse(raw);
    // migrate from v1
    const old = localStorage.getItem("pena_novel_data_v1");
    if(old){
      const d = JSON.parse(old);
      d.stories = (d.stories||[]).map(migrateStory);
      return d;
    }
  }catch(e){}
  return {stories:[], activeId:null};
}
function migrateStory(s){
  if(!s.items) s.items = [];
  if(!s.worldSetting) s.worldSetting = defaultWorldSetting();
  return s;
}
function defaultWorldSetting(){
  return {geografi:"",kekuatan:"",sejarah:"",faksi:"",hukum:"",budaya:"",bahasa:"",catatan:""};
}
function saveDB(){ localStorage.setItem(DB_KEY, JSON.stringify(db)); }
function uid(){ return Math.random().toString(36).slice(2,10); }

let db = loadDB();
// migrate existing stories
db.stories = (db.stories||[]).map(migrateStory);

let currentTab = "overview";

function getActiveStory(){
  return db.stories.find(s=>s.id===db.activeId)||null;
}
function newStory(title,desc){
  const s={
    id:uid(),title:title||"Cerita Tanpa Judul",desc:desc||"",
    characters:[],items:[],plots:[],scenes:[],dialogues:[],
    worldSetting:defaultWorldSetting()
  };
  db.stories.push(s);
  db.activeId=s.id;
  saveDB();
  return s;
}
if(db.stories.length===0) newStory("Cerita Pertamaku","Mulai tuliskan sinopsis di sini.");
if(!db.activeId) db.activeId=db.stories[0].id;

/* ═══════════════════════════════════
   UTILITIES
═══════════════════════════════════ */
function escapeHtml(str){
  if(!str) return "";
  return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function renderProseWithMentions(text, characters, items){
  if(!text) return "<em style='color:var(--muted)'>Belum ada isi.</em>";
  let html = escapeHtml(text);
  // Sort by name length desc so longer names matched first
  const sortedChars = [...(characters||[])].filter(c=>c.name&&c.name.trim()).sort((a,b)=>b.name.length-a.name.length);
  const sortedItems = [...(items||[])].filter(i=>i.name&&i.name.trim()).sort((a,b)=>b.name.length-a.name.length);
  sortedChars.forEach(c=>{
    const name=c.name.trim();
    const re=new RegExp("(?<![\\w\\-])("+name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")(?![\\w\\-])","gi");
    html=html.replace(re,(m)=>`<span class="char-mention" data-char="${c.id}">${m}</span>`);
  });
  sortedItems.forEach(it=>{
    const name=it.name.trim();
    const re=new RegExp("(?<![\\w\\-])("+name.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")(?![\\w\\-])","gi");
    html=html.replace(re,(m)=>`<span class="item-mention" data-item="${it.id}">${m}</span>`);
  });
  return html;
}

function attachMentionEvents(container, story){
  const charTip = document.getElementById("charTooltip");
  const itemTip = document.getElementById("itemTooltip");

  container.querySelectorAll(".char-mention").forEach(el=>{
    el.addEventListener("mouseenter",()=>{
      const c=story.characters.find(ch=>ch.id===el.dataset.char);
      if(!c) return;
      charTip.innerHTML=`
        ${c.image?`<img src="${escapeHtml(c.image)}" style="width:58px;height:58px;border-radius:50%;object-fit:cover;flex-shrink:0">`:
          `<div class="tp-ph tp-ph-char">${escapeHtml((c.name||"?")[0])}</div>`}
        <div><p class="tp-name">${escapeHtml(c.name)}</p>
        <p class="tp-sub">${escapeHtml(c.role||"Karakter")}</p>
        <p class="tp-desc">${escapeHtml(c.desc||"Tidak ada deskripsi.")}</p></div>`;
      charTip.classList.add("show");
    });
    el.addEventListener("mousemove",e=>{
      charTip.style.left=Math.min(e.clientX+16,window.innerWidth-285)+"px";
      charTip.style.top=Math.min(e.clientY+16,window.innerHeight-110)+"px";
    });
    el.addEventListener("mouseleave",()=>charTip.classList.remove("show"));
  });

  container.querySelectorAll(".item-mention").forEach(el=>{
    el.addEventListener("mouseenter",()=>{
      const it=story.items.find(i=>i.id===el.dataset.item);
      if(!it) return;
      itemTip.innerHTML=`
        ${it.image?`<img src="${escapeHtml(it.image)}" style="width:58px;height:58px;border-radius:8px;object-fit:cover;flex-shrink:0">`:
          `<div class="tp-ph tp-ph-item">${escapeHtml((it.name||"?")[0])}</div>`}
        <div><p class="tp-name">${escapeHtml(it.name)}</p>
        <p class="tp-sub">${escapeHtml(it.category||"Item")}</p>
        <p class="tp-desc">${escapeHtml(it.desc||"Tidak ada deskripsi.")}</p></div>`;
      itemTip.classList.add("show");
    });
    el.addEventListener("mousemove",e=>{
      itemTip.style.left=Math.min(e.clientX+16,window.innerWidth-285)+"px";
      itemTip.style.top=Math.min(e.clientY+16,window.innerHeight-110)+"px";
    });
    el.addEventListener("mouseleave",()=>itemTip.classList.remove("show"));
  });
}

function proRender(el, text, story){
  el.innerHTML = renderProseWithMentions(text, story.characters, story.items);
  attachMentionEvents(el, story);
}

/* ═══════════════════════════════════
   RENDER DISPATCHER
═══════════════════════════════════ */
const main = document.getElementById("main");

function render(){
  const story=getActiveStory();
  refreshStorySelect();
  document.querySelectorAll("nav.tabs button").forEach(b=>{
    b.classList.toggle("active",b.dataset.tab===currentTab);
  });
  if(!story){
    main.innerHTML=`<div class="empty-story">Belum ada cerita. Buat satu lewat tombol "+ Cerita baru".</div>`;
    return;
  }
  if(currentTab==="overview") renderOverview(story);
  else if(currentTab==="characters") renderCharacters(story);
  else if(currentTab==="items") renderItems(story);
  else if(currentTab==="worldsetting") renderWorldSetting(story);
  else if(currentTab==="plots") renderList(story,"plots","Plot","plot");
  else if(currentTab==="scenes") renderList(story,"scenes","Adegan","adegan");
  else if(currentTab==="dialogues") renderDialogues(story);
}

function refreshStorySelect(){
  const sel=document.getElementById("storySelect");
  sel.innerHTML=db.stories.map(s=>`<option value="${s.id}" ${s.id===db.activeId?"selected":""}>${escapeHtml(s.title)}</option>`).join("");
}

/* ═══════════════════════════════════
   OVERVIEW
═══════════════════════════════════ */
function renderOverview(story){
  main.innerHTML=`
    <div class="page-head">
      <h1>${escapeHtml(story.title)}</h1>
      <p>Ringkasan, sinopsis, dan pengaturan data cerita.</p>
    </div>
    <div class="editor-card">
      <div class="field"><label>Judul cerita</label><input type="text" id="ovTitle" value="${escapeHtml(story.title)}"></div>
      <div class="field">
        <label>Sinopsis — nama karakter <span style="color:var(--accent)">merah</span> &amp; nama item <span style="color:var(--teal)">hijau-biru</span> dapat di-hover</label>
        <textarea id="ovDesc" style="min-height:140px">${escapeHtml(story.desc)}</textarea>
      </div>
      <div class="toolbar"><button class="btn" id="ovSave">Simpan</button></div>
      <div class="prose-render" id="ovPreview"></div>
    </div>
    <div class="editor-card">
      <h2>Statistik &amp; Data</h2>
      <div class="stat-row">
        <span class="stat">🧑 Karakter: ${story.characters.length}</span>
        <span class="stat">⚔️ Item: ${story.items.length}</span>
        <span class="stat">🗺️ Plot: ${story.plots.length}</span>
        <span class="stat">🎬 Adegan: ${story.scenes.length}</span>
        <span class="stat">💬 Dialog: ${story.dialogues.length}</span>
      </div>
      <div class="toolbar" style="justify-content:flex-start;margin-top:14px">
        <button class="btn ghost small" id="exportBtn">Ekspor JSON</button>
        <button class="btn ghost small" id="importBtn">Impor JSON</button>
        <button class="btn ghost small" id="deleteStoryBtn">Hapus cerita ini</button>
      </div>
      <input type="file" id="importFile" accept=".json" style="display:none">
    </div>
  `;
  proRender(document.getElementById("ovPreview"), story.desc, story);
  document.getElementById("ovSave").onclick=()=>{
    story.title=document.getElementById("ovTitle").value||"Tanpa judul";
    story.desc=document.getElementById("ovDesc").value;
    saveDB(); render();
  };
  document.getElementById("exportBtn").onclick=()=>{
    const blob=new Blob([JSON.stringify(story,null,2)],{type:"application/json"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=story.title.replace(/\s+/g,"_")+".json";
    a.click();
  };
  document.getElementById("importBtn").onclick=()=>document.getElementById("importFile").click();
  document.getElementById("importFile").onchange=(e)=>{
    const f=e.target.files[0];
    if(!f) return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const imported=JSON.parse(ev.target.result);
        if(!imported.id) imported.id=uid();
        const exists=db.stories.findIndex(s=>s.id===imported.id);
        if(exists>=0){ if(confirm("Cerita dengan ID ini sudah ada. Timpa?")) db.stories[exists]=migrateStory(imported); }
        else { db.stories.push(migrateStory(imported)); }
        db.activeId=imported.id;
        saveDB(); render();
      }catch(err){ alert("Gagal membaca file JSON."); }
    };
    reader.readAsText(f);
  };
  document.getElementById("deleteStoryBtn").onclick=()=>{
    if(!confirm("Hapus cerita ini beserta semua isinya?")) return;
    db.stories=db.stories.filter(s=>s.id!==story.id);
    db.activeId=db.stories[0]?db.stories[0].id:null;
    saveDB(); render();
  };
}

/* ═══════════════════════════════════
   CHARACTERS
═══════════════════════════════════ */
function renderCharacters(story){
  main.innerHTML=`
    <div class="page-head"><h1>Karakter</h1>
    <p>Nama karakter otomatis terdeteksi di seluruh teks — hover nama untuk melihat gambar &amp; profil.</p></div>
    <div class="toolbar" style="justify-content:flex-start;margin-bottom:16px">
      <button class="btn" id="addCharBtn">+ Tambah karakter</button>
    </div>
    <div id="charForm"></div>
    <div class="grid" id="charGrid"></div>
  `;
  const grid=document.getElementById("charGrid");
  if(!story.characters.length) grid.innerHTML=`<p class="hint">Belum ada karakter. Klik "+ Tambah karakter" untuk mulai.</p>`;
  story.characters.forEach(c=>{
    const card=document.createElement("div");
    card.className="card thumb-wrap";
    card.innerHTML=`
      <button class="del">✕</button>
      ${c.image?`<img class="thumb" src="${escapeHtml(c.image)}" style="flex-shrink:0">`:
        `<div class="thumb placeholder">${escapeHtml((c.name||"?")[0])}</div>`}
      <div style="min-width:0">
        <span class="badge char">Karakter</span>
        <h3>${escapeHtml(c.name||"Tanpa nama")}</h3>
        <p>${escapeHtml(c.role||"—")}</p>
      </div>`;
    card.onclick=(e)=>{ if(e.target.classList.contains("del")) return; openCharForm(story,c); };
    card.querySelector(".del").onclick=(e)=>{ e.stopPropagation(); if(!confirm("Hapus karakter ini?")) return; story.characters=story.characters.filter(x=>x.id!==c.id); saveDB(); render(); };
    grid.appendChild(card);
  });
  document.getElementById("addCharBtn").onclick=()=>openCharForm(story,null);
}

function openCharForm(story,character){
  const fw=document.getElementById("charForm");
  const isNew=!character;
  const c=character||{id:uid(),name:"",role:"",desc:"",image:""};
  fw.innerHTML=`
    <div class="editor-card">
      <h2>${isNew?"Karakter baru":"Sunting karakter"}</h2>
      <div class="row">
        <div class="field"><label>Nama karakter</label><input type="text" id="cName" value="${escapeHtml(c.name)}" placeholder="Misal: Raina"></div>
        <div class="field"><label>Peran</label><input type="text" id="cRole" value="${escapeHtml(c.role)}" placeholder="Misal: Tokoh utama"></div>
      </div>
      <div class="field"><label>Deskripsi (fisik, kepribadian, latar belakang)</label><textarea id="cDesc" style="min-height:80px">${escapeHtml(c.desc)}</textarea></div>
      <div class="field">
        <label>Gambar (URL atau unggah file)</label>
        <div class="image-input-row">
          <input type="text" id="cImgUrl" value="${c.image&&c.image.startsWith("http")?c.image:""}" placeholder="https://..." style="flex:1">
          <input type="file" id="cImgFile" accept="image/*" style="width:auto">
          <img id="cImgPrev" class="image-preview round" src="${escapeHtml(c.image||"")}" style="${c.image?"":"display:none"}">
        </div>
        <p class="hint">Nama ini akan dikenali di semua teks (tidak peka huruf besar/kecil).</p>
      </div>
      <div class="toolbar">
        <button class="btn ghost" id="cCancel">Batal</button>
        <button class="btn" id="cSave">Simpan karakter</button>
      </div>
    </div>`;
  const prev=document.getElementById("cImgPrev");
  let curImg=c.image||"";
  document.getElementById("cImgUrl").oninput=(e)=>{ curImg=e.target.value; prev.src=curImg; prev.style.display=curImg?"block":"none"; };
  document.getElementById("cImgFile").onchange=(e)=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=(ev)=>{ curImg=ev.target.result; prev.src=curImg; prev.style.display="block"; }; r.readAsDataURL(f);
  };
  document.getElementById("cCancel").onclick=()=>fw.innerHTML="";
  document.getElementById("cSave").onclick=()=>{
    c.name=document.getElementById("cName").value.trim();
    c.role=document.getElementById("cRole").value.trim();
    c.desc=document.getElementById("cDesc").value.trim();
    c.image=curImg;
    if(!c.name){alert("Nama karakter wajib diisi.");return;}
    if(isNew) story.characters.push(c);
    saveDB(); fw.innerHTML=""; render();
  };
}

const ITEM_CATEGORIES=["Senjata","Perisai / Baju Zirah","Artefak Sihir","Relik / Pusaka","Alat / Perkakas","Ramuan / Obat","Buku / Peta / Dokumen","Makanan / Minuman","Kendaraan","Lainnya"];

function renderItems(story){
  main.innerHTML=`
    <div class="page-head"><h1>Item / Barang</h1>
    <p>Nama item otomatis terdeteksi di seluruh teks — hover nama untuk melihat gambar &amp; keterangan item.</p></div>
    <div class="toolbar" style="justify-content:flex-start;margin-bottom:16px">
      <button class="btn teal" id="addItemBtn">+ Tambah item</button>
    </div>
    <div id="itemObjForm"></div>
    <div class="grid" id="itemGrid"></div>
  `;
  const grid=document.getElementById("itemGrid");
  if(!story.items.length) grid.innerHTML=`<p class="hint">Belum ada item. Klik "+ Tambah item" untuk mulai.</p>`;
  story.items.forEach(it=>{
    const card=document.createElement("div");
    card.className="card thumb-wrap";
    card.innerHTML=`
      <button class="del">✕</button>
      ${it.image?`<img class="thumb item-thumb" src="${escapeHtml(it.image)}" style="flex-shrink:0;border-radius:8px">`:

      <div style="min-width:0">

  fw.innerHTML=`
    <div class="editor-card">
      <h2>${isNew?"Item baru":"Sunting item"}</h2>
      <div class="row">
        <div class="field"><label>Nama item</label><input type="text" id="iName" value="${escapeHtml(it.name)}" placeholder="Misal: Pedang Embun Fajar"></div>
        <div class="field"><label>Kategori</label>
          <select id="iCat"><option value="">— pilih kategori —</option>${catOpts}</select>
        </div>
      </div>
      <div class="field"><label>Deskripsi (penampilan, asal usul, makna)</label><textarea id="iDesc" style="min-height:80px">${escapeHtml(it.desc)}</textarea></div>
      <div class="field"><label>Sifat / Kemampuan khusus (opsional)</label><textarea id="iProps" style="min-height:60px" placeholder="Misal: memiliki kekuatan magis, bisa memotong besi, terbakar saat disentuh musuh...">${escapeHtml(it.properties||"")}</textarea></div>
      <div class="field">
        <label>Gambar item (URL atau unggah file)</label>
        <div class="image-input-row">
          <input type="text" id="iImgUrl" value="${it.image&&it.image.startsWith("http")?it.image:""}" placeholder="https://..." style="flex:1">
          <input type="file" id="iImgFile" accept="image/*" style="width:auto">
          <img id="iImgPrev" class="image-preview square" src="${escapeHtml(it.image||"")}" style="${it.image?"":"display:none"}">
        </div>
        <p class="hint">Nama item ini akan dikenali di semua teks (tidak peka huruf besar/kecil). Warna sorotan: <span style="color:var(--teal);font-weight:600">hijau-biru</span>.</p>
      </div>
      <div class="toolbar">
        <button class="btn ghost teal" id="iCancel">Batal</button>
        <button class="btn teal" id="iSave">Simpan item</button>
      </div>
    </div>`;
  const prev=document.getElementById("iImgPrev");
  let curImg=it.image||"";
  document.getElementById("iImgUrl").oninput=(e)=>{ curImg=e.target.value; prev.src=curImg; prev.style.display=curImg?"block":"none"; };
  document.getElementById("iImgFile").onchange=(e)=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=(ev)=>{ curImg=ev.target.result; prev.src=curImg; prev.style.display="block"; }; r.readAsDataURL(f);
  };
  document.getElementById("iCancel").onclick=()=>fw.innerHTML="";
  document.getElementById("iSave").onclick=()=>{
    it.name=document.getElementById("iName").value.trim();
    it.category=document.getElementById("iCat").value;
    it.desc=document.getElementById("iDesc").value.trim();
    it.properties=document.getElementById("iProps").value.trim();

    if(!it.name){alert("Nama item wajib diisi.");return;}
    if(isNew) story.items.push(it);
    saveDB(); fw.innerHTML=""; render();
  };
}

const WS_FIELDS=[
  {key:"geografi", ico:"🗾", label:"Geografi & Lokasi", hint:"Benua, kota, wilayah, alam, peta dunia, tempat-tempat penting."},
  {key:"kekuatan", ico:"✨", label:"Sistem Kekuatan / Teknologi", hint:"Sistem sihir, aturan penggunaannya, teknologi khas dunia, batasan."},
  {key:"sejarah",  ico:"📜", label:"Sejarah Dunia",       hint:"Peristiwa besar masa lalu, perang, zaman, tokoh-tokoh bersejarah."},
  {key:"faksi",    ico:"⚜️",  label:"Faksi & Organisasi",  hint:"Kerajaan, ordo, guild, sekte, kelompok kriminal, aliansi."},
  {key:"hukum",    ico:"⚖️",  label:"Hukum & Aturan Dunia",hint:"Aturan tak tertulis, hukum resmi, tabu, konsekuensi."},
  {key:"budaya",   ico:"🎭", label:"Budaya & Tradisi",    hint:"Adat istiadat, agama, kepercayaan, seni, perayaan, norma sosial."},
  {key:"bahasa",   ico:"🗣️", label:"Bahasa & Komunikasi", hint:"Bahasa yang digunakan, aksara, simbol, cara komunikasi khas."},
  {key:"catatan",  ico:"📝", label:"Catatan Lainnya",      hint:"Apapun yang tidak masuk kategori di atas."}
];

function renderWorldSetting(story){
  const ws=story.worldSetting||defaultWorldSetting();
  main.innerHTML=`
    <div class="page-head"><h1>Pengaturan Dunia</h1>
    <p>Bangun fondasi dunia ceritamu — geografi, sejarah, sistem kekuatan, faksi, budaya, dan lebih. Nama karakter &amp; item tetap aktif di teks ini.</p></div>
    <div id="wsFields"></div>
    <div class="toolbar" style="justify-content:flex-start">
      <button class="btn world" id="wsSave">Simpan semua</button>
    </div>
  `;
  const container=document.getElementById("wsFields");
  WS_FIELDS.forEach(f=>{
    const sec=document.createElement("div");
    sec.className="ws-section";
    const previewId=`wsPreview_${f.key}`;
    sec.innerHTML=`
      <h3><span class="ws-ico">${f.ico}</span>${f.label}</h3>
      <div class="field">
        <label>${f.hint}</label>
        <textarea id="ws_${f.key}" style="min-height:100px">${escapeHtml(ws[f.key]||"")}</textarea>
      </div>
      <div class="prose-render" id="${previewId}" style="${ws[f.key]?"":"display:none"}"></div>
    `;
    container.appendChild(sec);
    if(ws[f.key]){
      proRender(document.getElementById(previewId), ws[f.key], story);
    }
    // live preview on blur
    document.getElementById(`ws_${f.key}`).addEventListener("blur",()=>{
      const val=document.getElementById(`ws_${f.key}`).value;
      const prev=document.getElementById(previewId);
      if(val){ prev.style.display="block"; proRender(prev,val,story); }
      else prev.style.display="none";
    });
  });
  document.getElementById("wsSave").onclick=()=>{
    WS_FIELDS.forEach(f=>{
      ws[f.key]=document.getElementById(`ws_${f.key}`).value;
    });
    story.worldSetting=ws;
    saveDB();
    render();
  };
}

   PLOTS & SCENES (generic list)

function renderList(story,key,labelPlural,labelSingular){
  main.innerHTML=`
    <div class="page-head"><h1>${labelPlural}</h1>
    <p>Hover nama karakter (merah) atau nama item (hijau-biru) untuk melihat keterangannya.</p></div>
    <div class="toolbar" style="justify-content:flex-start;margin-bottom:16px">
      <button class="btn" id="addListItemBtn">+ Tambah ${labelSingular}</button>
    </div>
    <div id="listItemForm"></div>
    <div id="listItemList"></div>
  `;
  const listEl=document.getElementById("listItemList");
  const items=story[key];
  if(!items.length) listEl.innerHTML=`<p class="hint">Belum ada ${labelSingular}.</p>`;
  items.forEach(it=>{
    const card=document.createElement("div");
    card.className="editor-card";
    card.innerHTML=`
      <div class="toolbar" style="justify-content:space-between;margin-top:0">
        <h2 style="margin:0">${escapeHtml(it.title||"Tanpa judul")}</h2>
        <div><button class="btn ghost small editBtn">Sunting</button><button class="btn ghost small delBtn" style="margin-left:6px">Hapus</button></div>

    listEl.appendChild(card);

function openListItemForm(story,key,labelSingular,item){

  fw.innerHTML=`

      <h2>${isNew?"Tambah "+labelSingular:"Sunting "+labelSingular}</h2>

/* ═══════════════════════════════════
   DIALOGUES
═══════════════════════════════════ */
function renderDialogues(story){
  main.innerHTML=`
    <div class="page-head"><h1>Dialog</h1>
    <p>Percakapan antar karakter. Hover nama pembicara untuk melihat gambarnya.</p></div>
    <div class="toolbar" style="justify-content:flex-start;margin-bottom:16px">
      <button class="btn" id="addDlgBtn">+ Tambah adegan dialog</button>
    </div>
    <div id="dlgForm"></div>
    <div id="dlgList"></div>
  `;
  const listEl=document.getElementById("dlgList");
  if(!story.dialogues.length) listEl.innerHTML=`<p class="hint">Belum ada dialog.</p>`;
  story.dialogues.forEach(d=>{
    const card=document.createElement("div");
    card.className="editor-card";
    const linesHtml=(d.lines||[]).map(l=>{
      const char=story.characters.find(c=>c.id===l.charId);
      const nameHtml=char?`<span class="char-mention" data-char="${char.id}">${escapeHtml(char.name)}</span>`:escapeHtml(l.speakerFallback||"???");
      return `<p style="margin:5px 0"><strong>${nameHtml}:</strong> ${escapeHtml(l.text)}</p>`;
    }).join("");
    card.innerHTML=`
      <div class="toolbar" style="justify-content:space-between;margin-top:0">
        <h2 style="margin:0">${escapeHtml(d.title||"Tanpa judul")}</h2>
        <div><button class="btn ghost small editBtn">Sunting</button><button class="btn ghost small delBtn" style="margin-left:6px">Hapus</button></div>
      </div>
      <div class="prose-render">${linesHtml||"<em style='color:var(--muted)'>Belum ada baris.</em>"}</div>`;
    attachMentionEvents(card.querySelector(".prose-render"),story);
    card.querySelector(".editBtn").onclick=()=>openDialogueForm(story,d);
    card.querySelector(".delBtn").onclick=()=>{ if(!confirm("Hapus dialog ini?")) return; story.dialogues=story.dialogues.filter(x=>x.id!==d.id); saveDB(); render(); };
    listEl.appendChild(card);
  });
  document.getElementById("addDlgBtn").onclick=()=>openDialogueForm(story,null);
}

function openDialogueForm(story,dialogue){
  const fw=document.getElementById("dlgForm");
  const isNew=!dialogue;
  const d=dialogue||{id:uid(),title:"",lines:[]};
  let wLines=JSON.parse(JSON.stringify(d.lines||[]));
  function lineRow(l,idx){
    const opts=story.characters.map(c=>`<option value="${c.id}" ${l.charId===c.id?"selected":""}>${escapeHtml(c.name)}</option>`).join("");
    return `<div class="row" style="margin-bottom:9px;align-items:center" data-idx="${idx}">
      <div style="flex:0 0 155px"><select class="lChar"><option value="">— karakter —</option>${opts}</select></div>
      <div style="flex:1"><input type="text" class="lText" value="${escapeHtml(l.text||"")}" placeholder="Ucapan dialog..."></div>
      <button class="btn ghost small lDel" style="flex:0 0 auto">✕</button>
    </div>`;
  }
  function renderLines(){
    fw.querySelector("#dlgLines").innerHTML=wLines.map(lineRow).join("")||`<p class="hint">Belum ada baris.</p>`;
    fw.querySelectorAll(".row[data-idx]").forEach(row=>{
      const idx=+row.dataset.idx;
      row.querySelector(".lChar").onchange=(e)=>wLines[idx].charId=e.target.value;
      row.querySelector(".lText").oninput=(e)=>wLines[idx].text=e.target.value;
      row.querySelector(".lDel").onclick=()=>{ wLines.splice(idx,1); renderLines(); };
    });
  }
  fw.innerHTML=`
    <div class="editor-card">
      <h2>${isNew?"Tambah adegan dialog":"Sunting adegan dialog"}</h2>
      <div class="field"><label>Judul</label><input type="text" id="dTitle" value="${escapeHtml(d.title)}" placeholder="Misal: Pertemuan di stasiun"></div>
      <div class="field"><label>Baris dialog</label><div id="dlgLines"></div>
      <button class="btn ghost small" id="addLineBtn" style="margin-top:8px">+ Tambah baris</button></div>
      <div class="toolbar">
        <button class="btn ghost" id="dCancel">Batal</button>
        <button class="btn" id="dSave">Simpan dialog</button>
      </div>
    </div>`;
  renderLines();
  document.getElementById("addLineBtn").onclick=()=>{ wLines.push({charId:"",text:""}); renderLines(); };
  document.getElementById("dCancel").onclick=()=>fw.innerHTML="";
  document.getElementById("dSave").onclick=()=>{
    d.title=document.getElementById("dTitle").value.trim()||"Tanpa judul";
    d.lines=wLines.filter(l=>l.text&&l.text.trim());
    if(isNew) story.dialogues.push(d);
    saveDB(); fw.innerHTML=""; render();
  };
}
